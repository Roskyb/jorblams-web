<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Mesh pattern -->
  <g opacity="0.1">
    <circle cx="200" cy="150" r="80" fill="#e94560"/>
    <circle cx="1000" cy="480" r="120" fill="#e94560"/>
    <circle cx="800" cy="100" r="60" fill="#ff6b6b"/>
    <circle cx="300" cy="500" r="100" fill="#ff6b6b"/>
  </g>
  
  <!-- Main text -->
  <text x="600" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="700" fill="#ffffff" text-anchor="middle">Jorblams</text>
  
  <!-- Accent line -->
  <rect x="400" y="310" width="400" height="6" rx="3" fill="url(#accent)"/>
  
  <!-- Subtitle -->
  <text x="600" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#a0a0b0" text-anchor="middle">Blog &amp; Portfolio</text>
  
  <!-- URL -->
  <text x="600" y="560" font-family="monospace" font-size="24" fill="#606080" text-anchor="middle">jorblams.com</text>
</svg>